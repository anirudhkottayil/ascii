name: Build platform wheels
on: { workflow_dispatch: {}, push: { tags: ["v*"] } }
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compile: gcc c_src/img2ascii.c -o src/img2asc/bin/img2asc-bin -lm -static
          - os: macos-latest
            compile: cc -arch arm64 -o /tmp/img2asc-arm64 c_src/img2ascii.c -lm && cc -arch x86_64 -o /tmp/img2asc-x86_64 c_src/img2ascii.c -lm && lipo -create /tmp/img2asc-arm64 /tmp/img2asc-x86_64 -output src/img2asc/bin/img2asc-bin
          - os: windows-latest
            compile: gcc c_src/img2ascii.c -o src/img2asc/bin/img2asc-bin.exe -lm
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: stage5
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW (Windows only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with: { install: mingw-w64-x86_64-gcc }
      - name: Compile
        run: ${{ matrix.compile }}
      - name: Bundle font
        run: cp c_src/Px437_IBM_VGA_9x16.ttf src/img2asc/bin/
      - name: Build wheel
        run: pip install build && python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: stage5/dist/*.whl

  publish-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/*.whl --title ${{ github.ref_name }} --repo ${{ github.repository }}
